name: Build EXE & APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd desktop
          npm install --no-audit --no-fund
      - name: Build Windows EXE (NSIS installer)
        run: |
          cd desktop
          npx electron-builder --win nsis --publish never
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/dist/*.exe
          if-no-files-found: error

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK components
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM=$(find "$SDK" -path '*/cmdline-tools/*/bin/sdkmanager' 2>/dev/null | head -1)
          [ -n "$SM" ] || SM=$(find "$SDK" -name sdkmanager 2>/dev/null | head -1)
          echo "Using sdkmanager: $SM"
          yes | "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK
        run: |
          set -e
          cd android
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-8.7/bin/gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
